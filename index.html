<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b5bfd"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<title>Lingo</title>
<style>
:root{--bg:#f4f6fb;--sf:#fff;--ink:#101828;--mu:#667085;--ac:#3b5bfd;--ac2:#e9edff;--ln:#e6e9f2;--me:#3b5bfd}
@media(prefers-color-scheme:dark){:root{--bg:#0d1017;--sf:#161b25;--ink:#e9edf5;--mu:#8b95a7;--ac:#8196ff;--ac2:#1d2540;--ln:#252c3a;--me:#4a65f0}}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app{max-width:520px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
section{display:none;flex:1;min-height:0;flex-direction:column}section.on{display:flex}
header{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}
h1{font-size:26px;font-weight:700;letter-spacing:-.03em;flex:1}h2{font-size:17px;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;width:100%}
.btn.alt{background:var(--ac2);color:var(--ac)}
.ib{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--ac2);color:var(--ac);cursor:pointer}
input,select{font:inherit;color:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);outline:0}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.pad{padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700;object-fit:cover}
.pv{width:88px;height:88px;margin:4px auto;font-size:30px;cursor:pointer}
.list{flex:1;overflow:auto}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left}
.row:hover{background:var(--sf)}.row div{min-width:0}
.row b{display:block;font-weight:600}.row small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{margin-left:auto;background:var(--ac);color:#fff;padding:6px 14px;border-radius:99px;font-size:14px;font-weight:600}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;padding:9px 13px;border-radius:18px 18px 18px 6px;background:var(--sf);border:1px solid var(--ln);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.b.me{align-self:flex-end;background:var(--me);border-color:var(--me);color:#fff;border-radius:18px 18px 6px 18px}
.b img{display:block;max-width:100%;border-radius:12px;margin-bottom:4px}
.b i{display:block;font-size:12px;font-style:normal;opacity:.6;margin-top:2px;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--ln)}
.bar input{border-radius:22px}
.emo{display:none;flex-wrap:wrap;padding:8px;background:var(--sf);border-top:1px solid var(--ln)}.emo.on{display:flex}
.emo button{font-size:24px;width:42px;height:42px;border-radius:10px}.emo button:hover{background:var(--ac2)}
.mu{color:var(--mu);font-size:14px}.err{color:#d92d20;font-size:14px;min-height:18px}
.sheet{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:9}
.card{background:var(--sf);border-radius:24px;padding:24px;text-align:center;max-width:320px;width:86%}
.card svg{width:100%;height:auto;border-radius:12px;background:#fff;padding:10px}
.more{align-self:center;flex:none;background:var(--ac2);color:var(--ac);padding:6px 14px;border-radius:99px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ac);margin-left:auto;flex:none}
.act{display:flex;gap:16px;margin-top:4px}.act i{font-weight:600;opacity:.9}
.qt{border-left:3px solid var(--ac);padding:2px 8px;margin-bottom:4px;font-size:13px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .qt{border-color:#fff}
.rp{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--ac2);color:var(--ac);font-size:14px}.rp span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{padding:8px 16px;background:var(--ac2);color:var(--ac);font-size:14px}
.card button{display:block;width:100%}.card button+button{margin-top:8px}
.ib svg{width:20px;height:20px;display:block}.ib span{display:grid}
.tm{display:block;font-size:11px;opacity:.55;margin-top:2px;text-align:right}
.dv{align-self:center;font-size:12px;color:var(--mu);background:var(--sf);border:1px solid var(--ln);padding:2px 12px;border-radius:99px;margin:8px 0}
.rc{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}.row .rc small{font-size:12px}
#cl{display:block;font-size:13px;line-height:1.2}
#empty{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:12px}
@media(min-width:900px){
 body{display:grid;place-items:center}
 body.split{background:#e8ecf6}
 .app{width:100%;max-width:520px;height:100dvh}
 body.split .app{max-width:1040px;height:min(100dvh,860px);flex-direction:row;border-radius:20px;overflow:hidden;border:1px solid var(--ln);box-shadow:0 12px 40px #0002}
 body.split #home{display:flex;width:360px;flex:none;border-right:1px solid var(--ln)}
 body.split #chat{flex:1;min-width:0}
 body.split #home.on~#empty{display:flex}
 #back{display:none}
}
@media(min-width:900px) and (prefers-color-scheme:dark){body.split{background:#07090d}}
</style></head><body><div class="app">

<section id="auth"><div class="pad" style="margin:auto 0">
<img src="icon.svg" alt="" width="72" height="72" style="border-radius:18px"><h1 style="font-size:40px">Lingo</h1>
<p class="mu" style="margin-bottom:12px">Chat with friends in your own language. Every message is translated for you.</p>
<button class="btn" id="g">Continue with Google</button>
<input id="em" type="email" placeholder="Email" autocomplete="email">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn alt" id="si">Sign in</button><button class="btn alt" id="su">Create account</button><button id="fp" style="color:var(--ac);padding:6px;font-size:14px">Forgot password?</button>
<p class="err" id="ae"></p></div></section>

<section id="setup"><header><h2 id="st"></h2></header><div class="pad">
<label class="av pv" id="pv"><span id="pt">+</span><input id="pf" type="file" accept="image/*" hidden></label>
<input id="nm" placeholder="Your name" maxlength="30">
<input id="usr" placeholder="Username (letters, numbers, _)" maxlength="20" autocapitalize="none">
<select id="lg"></select>
<button class="btn" id="sv">Save</button>
<button class="btn alt" id="cx">Cancel</button><button class="btn alt" id="so">Sign out</button>
<p class="err" id="se"></p></div></section>

<section id="home"><header><h1>Chats</h1><button class="ib" id="bell" title="Turn on notifications" data-i="bell"></button><button class="ib" id="mb" title="Profile" data-i="user"></button></header>
<div style="padding:12px 16px 4px;display:flex;gap:8px"><input id="un" placeholder="Add a friend by @username" autocapitalize="none"><button class="ib" id="add" title="Send request" data-i="plus"></button></div>
<p class="err" id="he" style="padding:0 16px"></p>
<div class="list" id="list"></div>
<div style="padding:12px 16px calc(12px + env(safe-area-inset-bottom))"><div style="display:flex;gap:8px"><button class="btn alt" id="inv">Copy invite link</button><button class="btn alt" id="qb" style="width:auto">QR code</button></div></div></section>

<section id="chat"><header><button class="ib" id="back" title="Back" data-i="left"></button><span id="cav"></span><div style="flex:1;min-width:0"><h2 id="cn"></h2><small class="mu" id="cl"></small></div><button class="ib" id="mn" title="More" data-i="more"></button></header>
<div class="msgs" id="msgs"></div><p class="mu" id="ty" hidden style="padding:0 16px 6px"></p><p class="note" id="pz" hidden>Translation is paused (monthly limit reached). Showing original messages.</p><div class="emo" id="emo"></div><div class="rp" id="rp" hidden><span id="rpt"></span><button id="rpx" title="Cancel reply" data-i="x"></button></div><p class="note" id="bk" hidden></p>
<div class="bar" id="bar"><label class="ib" title="Send a photo"><span data-i="image"></span><input id="ph" type="file" accept="image/*" hidden></label><button class="ib" id="eb" title="Emoji" data-i="smile"></button><button class="ib" id="mic" title="Dictate" data-i="mic"></button>
<input id="tx" placeholder="Message" autocomplete="off"><button class="ib" id="sd" style="background:var(--ac);color:#fff" title="Send" data-i="send"></button></div></section>
<div id="empty"><img src="icon.svg" alt="" width="88" height="88" style="border-radius:22px"><p class="mu">Select a chat to start talking</p></div>
</div>
<div class="sheet" id="qr" hidden><div class="card"><div id="qrimg"></div><p class="mu" style="margin-top:14px">Friends scan this to send you a chat request. Tap anywhere to close.</p></div></div>

<div class="sheet" id="mnu" hidden><div class="card"><button class="btn alt" id="blk">Block</button><button class="btn alt" id="rm">Remove chat from my list</button><button class="btn alt" id="mx">Close</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
// ---- 1. Fill in your own values (see Firebase console + Cloudflare) ----
const CFG={firebase:{apiKey:"AIzaSyBsdUVcHyZVkilQjcfFs4j8w5f_NFwRMGA",authDomain:"lingo-cfe8c.firebaseapp.com",projectId:"lingo-cfe8c",messagingSenderId:"973614721002",appId:"1:973614721002:web:4b82332c43c4cd18adb493"},vapid:"BN8HlTXMkg1eDtkO6cvRHPF6Iz5X_zMtHE1EMtEnAlEcOpAYEtZdDGrL-F32-x0FtqV0GAGovOu6WH9Ho7I8Ps8",worker:"https://lingo-worker.abdotaib-1999.workers.dev"};
const V="https://www.gstatic.com/firebasejs/10.14.1/";
const{initializeApp}=await import(V+"firebase-app.js");
const{getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail}=await import(V+"firebase-auth.js");
const{getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,addDoc,deleteDoc,collection,query,where,orderBy,limit,onSnapshot,serverTimestamp,arrayUnion,writeBatch,Timestamp,deleteField}=await import(V+"firebase-firestore.js");
const{getMessaging,getToken,isSupported}=await import(V+"firebase-messaging.js");
const app=initializeApp(CFG.firebase),auth=getAuth(app),db=getFirestore(app);

const L=[["AR","العربية"],["BG","Български"],["CS","Čeština"],["DA","Dansk"],["DE","Deutsch"],["EL","Ελληνικά"],["EN-US","English (US)"],["EN-GB","English (UK)"],["ES","Español"],["ET","Eesti"],["FI","Suomi"],["FR","Français"],["HU","Magyar"],["ID","Bahasa Indonesia"],["IT","Italiano"],["JA","日本語"],["KO","한국어"],["LT","Lietuvių"],["LV","Latviešu"],["NB","Norsk"],["NL","Nederlands"],["PL","Polski"],["PT-BR","Português (Brasil)"],["PT-PT","Português (Portugal)"],["RO","Română"],["RU","Русский"],["SK","Slovenčina"],["SL","Slovenščina"],["SV","Svenska"],["TR","Türkçe"],["UK","Українська"],["ZH","中文 (简体)"]];
const EMO="😀 😂 🤣 😊 😍 🥰 😎 🤔 😢 😭 😡 😮 😴 🥳 🤗 😉 👍 👎 🙏 👏 🙌 💪 👋 🤝 ❤️ 💙 🔥 ✨ 🎉 🎶 ☕ 🍕 ⚽ 🌍 🏠 🚀".split(" ");
const $=s=>document.querySelector(s),base=l=>l.split("-")[0],key=l=>l.replace("-","_");
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const show=id=>{document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id));document.body.classList.toggle("split",id==="home"||id==="chat")};
const emoOnly=t=>/^[\p{Extended_Pictographic}\s\u200d\ufe0f]*$/u.test(t);
const shrink=(f,max,q)=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=h("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",q))};i.src=URL.createObjectURL(f)});
const hd=async()=>({"content-type":"application/json",authorization:"Bearer "+await auth.currentUser.getIdToken()});
const tr=async(text,target)=>{const r=await fetch(CFG.worker+"/translate",{method:"POST",headers:await hd(),body:JSON.stringify({text,target})});if(r.status===429)throw"quota";if(!r.ok)throw 0;const j=await r.json();return{text:j.text,src:j.src||""}};
L.forEach(([v,n])=>$("#lg").append(new Option(n,v)));
const IC={bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',left:'<path d="m15 18-6-6 6-6"/>',more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/>',mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'};
document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[e.dataset.i]+"</svg>");
const dayLbl=ms=>{const d=new Date(ms),n=new Date(),same=(a,b)=>a.toDateString()===b.toDateString();return same(d,n)?"Today":same(d,new Date(Date.now()-864e5))?"Yesterday":d.toLocaleDateString([],{day:"numeric",month:"short",year:d.getFullYear()===n.getFullYear()?undefined:"numeric"})};
const hm=ms=>new Date(ms).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const lt=ts=>{const ms=ts?.toMillis?.(),l=ms&&dayLbl(ms);return!ms?"":l==="Today"?hm(ms):l};
EMO.forEach(e=>{const b=h("button","",e);b.onclick=()=>{$("#tx").value+=e;$("#tx").focus()};$("#emo").append(b)});

let uid,me,editing=false,cur=null,unC,unM,photoData="";const U={},P={},busy=new Set();let unT,replyTo=null,paused=false,lastT=0;
const user=async id=>U[id]||(U[id]={id,...(await getDoc(doc(db,"users",id))).data()});
const av=u=>{if(u.photo){const i=h("img","av");i.src=u.photo;return i}return h("div","av",(u.name||"?")[0].toUpperCase())};

// ---- Sign in ----
const gp=new GoogleAuthProvider(),aerr=e=>$("#ae").textContent=e.message.replace("Firebase: ","");
$("#g").onclick=()=>signInWithPopup(auth,gp).catch(aerr);
$("#si").onclick=()=>signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value).catch(aerr);
$("#su").onclick=()=>createUserWithEmailAndPassword(auth,$("#em").value,$("#pw").value).catch(aerr);
$("#fp").onclick=()=>{const e=$("#em").value.trim(),m=$("#ae");m.style.color="";if(!e)return m.textContent="Type your email above first.";
 sendPasswordResetEmail(auth,e).then(()=>{m.style.color="var(--mu)";m.textContent="If an account exists for that email, a reset link is on its way. Check spam too."}).catch(aerr)};
$("#so").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 if(!u){uid=null;unC?.();unM?.();show("auth");return}
 uid=u.uid;const s=await getDoc(doc(db,"users",uid));
 if(s.exists()){me=s.data();home()}else openSetup(false,{name:u.displayName||""});
});

// ---- Profile ----
const setPv=d=>{$("#pv").style.background=d?`url(${d}) center/cover`:"";$("#pt").textContent=d?"":"+"};
function openSetup(edit,d){editing=edit;photoData=d.photo||"";$("#nm").value=d.name||"";$("#usr").value=d.username||"";$("#usr").disabled=edit;$("#lg").value=d.lang||"EN-US";setPv(photoData);
 $("#cx").hidden=$("#so").hidden=!edit;$("#st").textContent=edit?"Edit profile":"Set up your profile";$("#se").textContent="";show("setup")}
$("#pf").onchange=async e=>{const f=e.target.files[0];if(f){photoData=await shrink(f,128,.8);setPv(photoData)}};
$("#cx").onclick=()=>home();$("#mb").onclick=()=>openSetup(true,me);
$("#sv").onclick=async()=>{
 const name=$("#nm").value.trim(),un=$("#usr").value.trim().toLowerCase(),lang=$("#lg").value,e=$("#se");
 if(!name)return e.textContent="Enter your name.";
 if(!/^[a-z0-9_]{3,20}$/.test(un))return e.textContent="Username: 3–20 letters, numbers or _";
 try{const b=writeBatch(db);
  if(editing)b.update(doc(db,"users",uid),{name,lang,photo:photoData});
  else{b.set(doc(db,"usernames",un),{uid});b.set(doc(db,"users",uid),{name,username:un,lang,photo:photoData,tokens:[]})}
  await b.commit();me={tokens:[],...me,name,lang,photo:photoData,username:editing?me.username:un};delete U[uid];home();
 }catch{e.textContent=editing?"Could not save. Try again.":"That username is taken."}
};

// ---- Chat list & friends ----
function home(){
 show("home");cur=null;unM?.();unC?.();unT?.();
 $("#bell").hidden=typeof Notification!=="undefined"&&Notification.permission==="granted";
 unC=onSnapshot(query(collection(db,"chats"),where("members","array-contains",uid)),async s=>{
  const cs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updated?.seconds||9e9)-(a.updated?.seconds||9e9)).filter(c=>{const hs=c.hidden?.[uid]?.seconds;return!(hs&&(c.updated?.seconds||0)<=hs)});
  const rows=await Promise.all(cs.map(async c=>row(c,await user(c.members.find(x=>x!==uid)))));
  $("#list").replaceChildren(...(rows.length?rows:[Object.assign(h("p","mu","No chats yet. Add a friend by username or share your invite link."),{style:"padding:20px"})]));
 });
 const a=new URLSearchParams(location.search).get("add");if(a){history.replaceState(0,"",location.pathname);request(a)}
}
function row(c,o){
 const b=h("button","row"),t=h("div"),pend=c.status==="pending",incoming=pend&&c.from!==uid;
 t.append(h("b","",o.name),h("small","",pend?(incoming?"Wants to chat with you":"Request sent"):c.last||"Say hi 👋"));
 const r=h("div","rc");r.append(h("small","",lt(c.updated)));if(incoming)r.append(h("span","pill","Accept"));if(c.lastFrom&&c.lastFrom!==uid&&(c.updated?.seconds||0)>(c.seen?.[uid]?.seconds||0))r.append(h("span","dot"));b.append(av(o),t,r);
 b.onclick=async()=>{if(pend){if(!incoming)return;await updateDoc(doc(db,"chats",c.id),{status:"active"})}open(c,o)};
 return b}
async function request(un){
 const e=$("#he");e.textContent="";un=un.trim().replace(/^@/,"").toLowerCase();if(!un)return;
 try{const s=await getDoc(doc(db,"usernames",un));
  if(!s.exists())return e.textContent="No one has that username.";
  const o=s.data().uid;if(o===uid)return e.textContent="That's your own username.";
  const id=[uid,o].sort().join("_");
  if((await getDoc(doc(db,"chats",id))).exists())return e.textContent="You already have a chat with them.";
  await setDoc(doc(db,"chats",id),{members:[uid,o],status:"pending",from:uid,last:"",updated:serverTimestamp()});$("#un").value="";
 }catch{e.textContent="Could not send the request."}}
$("#add").onclick=()=>request($("#un").value);$("#un").onkeydown=e=>{if(e.key==="Enter")request($("#un").value)};
const inviteUrl=()=>location.origin+location.pathname+"?add="+me.username;
$("#inv").onclick=async()=>{await navigator.clipboard.writeText(inviteUrl());$("#inv").textContent="Copied!";setTimeout(()=>$("#inv").textContent="Copy invite link",1500)};
$("#qb").onclick=()=>{const q=qrcode(0,"M");q.addData(inviteUrl());q.make();$("#qrimg").innerHTML=q.createSvgTag({scalable:true});$("#qr").hidden=false};
$("#qr").onclick=()=>$("#qr").hidden=true;
$("#bell").onclick=async()=>{try{
 if(!(await isSupported()))return $("#he").textContent="On iPhone: tap Share, then Add to Home Screen, and open Lingo from there.";
 if(await Notification.requestPermission()!=="granted")return;
 const reg=await navigator.serviceWorker.register("firebase-messaging-sw.js");
 const t=await getToken(getMessaging(app),{vapidKey:CFG.vapid,serviceWorkerRegistration:reg});
 await updateDoc(doc(db,"users",uid),{tokens:arrayUnion(t)});$("#bell").hidden=true;
}catch{$("#he").textContent="Could not turn on notifications."}};

// ---- Conversation ----
async function open(c,o){
 cur={id:c.id,o,blocked:""};replyTo=null;$("#rp").hidden=true;$("#ty").hidden=true;show("chat");$("#cn").textContent=o.name;$("#cl").textContent=L.find(l=>l[0]===o.lang)?.[1]||"";$("#cav").replaceChildren(av(o));$("#msgs").replaceChildren();$("#emo").classList.remove("on");
 const cref=doc(db,"chats",c.id),seen=()=>updateDoc(cref,{["seen."+uid]:serverTimestamp()}).catch(()=>{});
 getDocs(query(collection(db,"chats",c.id,"photos"),where("expireAt","<",Timestamp.now()))).then(s=>s.forEach(d=>d.data().from===uid&&deleteDoc(d.ref))).catch(()=>{});
 let first=true,n=50,keep=0,shown=0,tm;unT?.();
 unT=onSnapshot(cref,s=>{const d=s.data({serverTimestamps:"estimate"});if(!d)return;
  cur.blocked=d.blocked||"";$("#bar").hidden=!!cur.blocked;$("#bk").hidden=!cur.blocked;
  $("#bk").textContent=cur.blocked===uid?"You blocked this person. Unblock from the ⋯ menu.":"You can't reply in this chat.";
  const t=d.typing?.[o.id]?.toMillis?.(),ty=$("#ty");clearTimeout(tm);
  if(t&&Date.now()-t<5000){ty.textContent=o.name+" is typing…";ty.hidden=false;tm=setTimeout(()=>ty.hidden=true,5000)}else ty.hidden=true});
 const sub=()=>{unM?.();unM=onSnapshot(query(collection(db,"chats",c.id,"messages"),orderBy("t","desc"),limit(n)),s=>{
  const bx=$("#msgs"),near=bx.scrollHeight-bx.scrollTop-bx.clientHeight<90,ds=s.docs.reverse(),els=ds.flatMap((d,i)=>{const g=x=>x.data({serverTimestamps:"estimate"}).t?.toMillis?.(),t=g(d),p=i&&g(ds[i-1]);return t&&(!p||new Date(t).toDateString()!==new Date(p).toDateString())?[h("div","dv",dayLbl(t)),bubble(d)]:[bubble(d)]});
  if(s.size>=n){const mb=h("button","more","Load earlier messages");mb.onclick=()=>{keep=bx.scrollHeight-bx.scrollTop;n+=50;sub()};els.unshift(mb)}
  bx.replaceChildren(...els);
  if(keep&&s.size>shown){bx.scrollTop=bx.scrollHeight-keep;keep=0}else if(!keep&&(first||near))bx.scrollTop=bx.scrollHeight;
  if(ds.length&&ds[ds.length-1].data().from!==uid)seen();
  first=false;shown=s.size})};
 sub();
}
function bubble(d){
 const m=d.data({serverTimestamps:"estimate"}),mine=m.from===uid,b=h("div","b"+(mine?" me":"")),cid=cur.id;let x=null;
 if(m.re)b.append(h("div","qt",m.re));
 if(m.img){const i=h("img");b.append(i);photo(m.img,i,b,cid)}
 if(m.text){x=h("span","",m.text);x.dir="auto";b.append(x);
  if(!mine&&m.lang&&base(m.lang)!==base(me.lang)&&!emoOnly(m.text)){
   const t=m.tr?.[key(me.lang)];
   if(t){if(!(m.src&&base(m.src)===base(me.lang))){
     const nm=m.src?" from "+(L.find(l=>base(l[0])===m.src)?.[1]||m.src).replace(/ \(.*\)/,""):"",lbl="Translated"+nm+" · tap for original",n=h("i","",lbl);
     x.textContent=t;b.append(n);
     n.onclick=e=>{e.stopPropagation();const o=n.dataset.o;n.dataset.o=o?"":"1";x.textContent=o?t:m.text;n.textContent=o?lbl:"Original · tap for translation"}}}
   else if(!paused){x.textContent="Translating…";x.style.opacity=.6;translate(d.ref,m,x)}}}
 const tmx=m.t?.toMillis?.();if(tmx)b.append(h("small","tm",hm(tmx)));
 const act=h("div","act");act.hidden=true;
 const add=(s,f)=>{const a=h("i","",s);a.onclick=e=>{e.stopPropagation();f()};act.append(a)};
 add("Reply",()=>{replyTo=(m.text||"📷 Photo").slice(0,100);$("#rpt").textContent=replyTo;$("#rp").hidden=false;$("#tx").focus()});
 if(x&&!mine)add("Listen",()=>speak(x.textContent));
 if(mine)add("Delete",()=>{deleteDoc(d.ref);if(m.img)deleteDoc(doc(db,"chats",cid,"photos",m.img))});
 b.append(act);b.onclick=()=>act.hidden=!act.hidden;
 return b}
async function translate(ref,m,x){
 if(busy.has(ref.id))return;busy.add(ref.id);
 try{const r=await tr(m.text,me.lang);await updateDoc(ref,{["tr."+key(me.lang)]:r.text,src:r.src})}
 catch(e){x.textContent=m.text;x.style.opacity=1;if(e==="quota"){paused=true;$("#pz").hidden=false}}finally{busy.delete(ref.id)}}
async function photo(pid,img,b,cid){
 if(!(pid in P))try{P[pid]=(await getDoc(doc(db,"chats",cid,"photos",pid))).data()||null}catch{P[pid]=null}
 const p=P[pid];if(p&&p.expireAt.toMillis()>Date.now())img.src=p.data;else{img.remove();b.prepend(h("i","","Photo expired"))}}
async function send(img){
 const text=$("#tx").value.trim();if(!cur||(!text&&!img))return;$("#tx").value="";$("#emo").classList.remove("on");
 const cid=cur.id,oid=cur.o.id;let pid=null;
 try{if(img){pid=doc(collection(db,"chats",cid,"photos")).id;
   await setDoc(doc(db,"chats",cid,"photos",pid),{from:uid,data:img,expireAt:Timestamp.fromMillis(Date.now()+15*864e5)})}
  await addDoc(collection(db,"chats",cid,"messages"),{from:uid,text,lang:me.lang,img:pid,t:serverTimestamp(),...(replyTo?{re:replyTo}:{})});
  await updateDoc(doc(db,"chats",cid),{last:(pid?"📷 ":"")+text,updated:serverTimestamp(),lastFrom:uid});replyTo=null;$("#rp").hidden=true;
  const o=(await getDoc(doc(db,"users",oid))).data();
  if(o?.tokens?.length)fetch(CFG.worker+"/push",{method:"POST",headers:await hd(),body:JSON.stringify({tokens:o.tokens,name:me.name})}).catch(()=>{});
 }catch{$("#tx").value=text}}
$("#sd").onclick=()=>send();$("#tx").onkeydown=e=>{if(e.key==="Enter")send()};
$("#ph").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(f)send(await shrink(f,1000,.7))};
$("#eb").onclick=()=>$("#emo").classList.toggle("on");$("#back").onclick=()=>home();
$("#tx").dir="auto";
const bcp=l=>({NB:"nb-NO",ZH:"zh-CN"}[l]||l).replace(/^[A-Z]+/,x=>x.toLowerCase());
const speak=t=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=bcp(me.lang);speechSynthesis.speak(u)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$("#mic").hidden=!SR;
$("#mic").onclick=()=>{const r=new SR();r.lang=bcp(me.lang);r.onresult=e=>{$("#tx").value+=($("#tx").value?" ":"")+e.results[0][0].transcript};r.onend=()=>$("#mic").style.opacity=1;$("#mic").style.opacity=.5;r.start()};
$("#tx").oninput=()=>{if(cur&&Date.now()-lastT>3000){lastT=Date.now();updateDoc(doc(db,"chats",cur.id),{["typing."+uid]:serverTimestamp()}).catch(()=>{})}};
$("#rpx").onclick=()=>{replyTo=null;$("#rp").hidden=true};
$("#mn").onclick=()=>{$("#blk").textContent=cur.blocked===uid?"Unblock":"Block";$("#blk").hidden=!!cur.blocked&&cur.blocked!==uid;$("#mnu").hidden=false};
$("#mx").onclick=()=>$("#mnu").hidden=true;
$("#blk").onclick=async()=>{await updateDoc(doc(db,"chats",cur.id),{blocked:cur.blocked===uid?deleteField():uid}).catch(()=>{});$("#mnu").hidden=true};
$("#rm").onclick=async()=>{await updateDoc(doc(db,"chats",cur.id),{["hidden."+uid]:serverTimestamp()}).catch(()=>{});$("#mnu").hidden=true;home()};
</script></body></html>
